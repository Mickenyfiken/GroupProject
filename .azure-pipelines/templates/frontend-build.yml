parameters:
  frontendPath: frontend
  nodeVersion: 20.x

steps:
  - task: NodeTool@0
    displayName: Use Node.js 20
    inputs:
      versionSpec: ${{ parameters.nodeVersion }}

  - task: Npm@1
    displayName: Install frontend dependencies
    inputs:
      command: ci
      workingDir: ${{ parameters.frontendPath }}

  - task: Npm@1
    displayName: ESLint
    inputs:
      command: custom
      workingDir: ${{ parameters.frontendPath }}
      customCommand: run lint

  - task: Npm@1
    displayName: Prettier format check
    inputs:
      command: custom
      workingDir: ${{ parameters.frontendPath }}
      customCommand: run format:check

  - task: Npm@1
    displayName: Build frontend
    inputs:
      command: custom
      workingDir: ${{ parameters.frontendPath }}
      customCommand: run build
