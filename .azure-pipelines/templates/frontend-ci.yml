parameters:
  frontendPath: ''
  nodeVersion: ''
  viteApiTarget: ''

steps:
  - task: NodeTool@0
    displayName: Use Node.js 20
    inputs:
      versionSpec: ${{ parameters.nodeVersion }}

  - task: Cache@2
    displayName: Cache node_modules
    inputs:
      key: npm | "$(Agent.OS)" | ${{ parameters.frontendPath }}/package-lock.json
      restoreKeys: |
        npm | "$(Agent.OS)"
      path: ${{ parameters.frontendPath }}/node_modules

  - task: Npm@1
    displayName: Install frontend dependencies
    inputs:
      command: ci
      workingDir: ${{ parameters.frontendPath }}

  - task: Npm@1
    displayName: ESLint
    inputs:
      command: custom
      workingDir: ${{ parameters.frontendPath }}
      customCommand: run lint

  - task: Npm@1
    displayName: Prettier format check
    inputs:
      command: custom
      workingDir: ${{ parameters.frontendPath }}
      customCommand: run check

  - task: Npm@1
    displayName: Build frontend
    inputs:
      command: custom
      workingDir: ${{ parameters.frontendPath }}
      customCommand: run build
    env:
      VITE_API_TARGET: ${{ parameters.viteApiTarget }}

  - task: PublishPipelineArtifact@1
    displayName: Publish frontend artifact
    inputs:
      targetPath: ${{ parameters.frontendPath }}/dist
      artifact: frontend
