parameters:
  buildConfiguration: ''
  nugetCache: ''
  projects: ''
  testProjects: ''

steps:
  - task: UseDotNet@2
    displayName: Use .NET SDK
    inputs:
      packageType: sdk
      version: 10.0.x

  - script: mkdir -p ${{ parameters.nugetCache }}
    displayName: Ensure NuGet cache dir

  - task: Cache@2
    displayName: Cache NuGet
    inputs:
      key: nuget | "$(Agent.OS)" | **/*.csproj,global.json,**/packages.lock.json
      restoreKeys: |
        nuget | "$(Agent.OS)"
      path: ${{ parameters.nugetCache }}

  - task: DotNetCoreCLI@2
    displayName: Restore backend
    inputs:
      command: restore
      projects: ${{ parameters.projects }}
      arguments: --use-lock-file --locked-mode

  - task: DotNetCoreCLI@2
    displayName: Build backend
    inputs:
      command: build
      projects: ${{ parameters.projects }}
      arguments: --configuration ${{ parameters.buildConfiguration }} --no-restore

  - task: DotNetCoreCLI@2
    displayName: Run backend tests
    inputs:
      command: test
      projects: ${{ parameters.testProjects }}
      arguments: --configuration ${{ parameters.buildConfiguration }} --logger trx

  - task: PublishTestResults@2
    displayName: Publish test results
    inputs:
      testResultsFiles: '**/*.trx'
      testRunTitle: Backend Tests

  - task: DotNetCoreCLI@2
    displayName: Publish backend
    inputs:
      command: publish
      publishWebProjects: false
      projects: ${{ parameters.projects }}
      arguments: --configuration ${{ parameters.buildConfiguration }} --no-build --output $(Build.ArtifactStagingDirectory)/backend
      zipAfterPublish: true

  - task: PublishBuildArtifacts@1
    displayName: Publish backend artifact
    inputs:
      PathtoPublish: $(Build.ArtifactStagingDirectory)/backend
      ArtifactName: backend
