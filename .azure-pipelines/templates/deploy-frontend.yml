parameters:
  appName: ''
  artifactName: ''
  deploymentToken: ''

steps:
  - task: AzureStaticWebApp@0
    displayName: Deploy frontend (SWA artifact)
    inputs:
      app_location: ${{ parameters.artifactName }}
      output_location: dist
      azure_static_web_apps_api_token: ${{ parameters.deploymentToken }}
