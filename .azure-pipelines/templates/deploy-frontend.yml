parameters:
  artifactName: ''
  deploymentToken: ''
  appName: ''

steps:
  - download: current
    artifact: ${{ parameters.artifactName }}

  - script: |
      echo "Listing files for debug:"
      ls -R $(Pipeline.Workspace)
    displayName: Debug files

  - task: AzureCLI@2
    displayName: Deploy frontend (SWA artifact)
    inputs:
      azureSubscription: sportson-connection
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        echo "Deploying frontend..."

        az staticwebapp deploy \
          --name ${{ parameters.appName }} \
          --source "$(Pipeline.Workspace)/frontend/dist" \
          --token ${{ parameters.deploymentToken }}