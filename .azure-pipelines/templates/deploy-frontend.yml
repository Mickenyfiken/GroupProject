parameters:
  artifactName: ''
  deploymentToken: ''
  appName: ''

steps:
  - download: current
    artifact: ${{ parameters.artifactName }}

  - task: AzureStaticWebApp@0
    displayName: Deploy frontend
    inputs:
      app_location: '$(Pipeline.Workspace)/frontend'
      output_location: ''
      skip_app_build: true
      azure_static_web_apps_api_token: ${{ parameters.deploymentToken }}