parameters:
  appName: ''
  artifactName: ''
  deploymentToken: ''
  azureSubscription: ''

steps:
  - download: current
    artifact: ${{ parameters.artifactName }}

  - task: AzureCLI@2
    displayName: Deploy frontend (SWA artifact)
    inputs:
      # azureSubscription: ${{ parameters.azureSubscription }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        echo "Deploying frontend artifact to Static Web App..."

        az staticwebapp deploy \
          --name ${{ parameters.appName }} \
          --source "$(Pipeline.Workspace)/${{ parameters.artifactName }}" \
          --token ${{ parameters.deploymentToken }}
