parameters:
  artifactName: ''
  deploymentToken: ''
  appName: ''

steps:
  - download: current
    artifact: ${{ parameters.artifactName }}

  - script: ls -R $(Pipeline.Workspace)/${{ parameters.artifactName }}
    displayName: Inspect artifact structure

  - task: AzureCLI@2
    displayName: Deploy frontend (SWA artifact)
    inputs:
      app_location: $(Pipeline.Workspace)/${{ parameters.artifactName }}/dist
      skip_app_build: true
      azure_static_web_apps_api_token: ${{ parameters.deploymentToken }}
