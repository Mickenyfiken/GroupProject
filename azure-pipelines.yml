trigger:
  branches:
    include:
      - develop
  paths:
    include:
      - backend/**
      - frontend/**
      - azure-pipelines.yml
      - .azure-pipelines/**

pr:
  branches:
    include:
      - develop

pool:
  vmImage: ubuntu-latest

variables:
  - group: frontend-secrets

  - name: BUILD_CONFIGURATION
    value: Release
  - name: BACKEND_PROJECTS
    value: backend/**/*.csproj
  - name: BACKEND_TEST_PROJECTS
    value: backend/**/*.Tests.csproj
  - name: FRONTEND_PATH
    value: frontend
  - name: NODE_VERSION
    value: 20.x

stages:
  - stage: Build_Backend
    displayName: Build Backend
    jobs:
      - job: build_backend
        displayName: Build Backend
        steps:
          - template: .azure-pipelines/templates/backend-build.yml
            parameters:
              projects: $(BACKEND_PROJECTS)
              buildConfiguration: $(BUILD_CONFIGURATION)

  - stage: Test_Backend
    displayName: Test Backend
    dependsOn: Build_Backend
    condition: succeeded()
    jobs:
      - job: test_backend
        displayName: Test Backend
        steps:
          - template: .azure-pipelines/templates/backend-test.yml
            parameters:
              testProjects: $(BACKEND_TEST_PROJECTS)
              buildConfiguration: $(BUILD_CONFIGURATION)

  - stage: Build_Frontend
    displayName: Build Frontend
    dependsOn: Test_Backend
    condition: succeeded()
    jobs:
      - job: build_frontend
        displayName: Build Frontend
        steps:
          - template: .azure-pipelines/templates/frontend-build.yml
            parameters:
              frontendPath: $(FRONTEND_PATH)
              nodeVersion: $(NODE_VERSION)

  - stage: Backend_Deploy
    displayName: Deploy Backend
    dependsOn:
      - Test_Backend
      - Build_Frontend
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - deployment: deploy_backend
        displayName: Deploy Backend
        environment: development
        strategy:
          runOnce:
            deploy:
              steps:
                - template: .azure-pipelines/templates/backend-deploy.yml
                  parameters:
                    azureSubscription: sportson-connection
                    appType: webApp
                    appName: sportson-backend-dev
                    artifactName: backend
                    packagePath: $(Pipeline.Workspace)/backend/**/*.zip