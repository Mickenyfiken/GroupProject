trigger:
  branches:
    include:
      - develop
  paths:
    include:
      - backend/**
      - frontend/**
      - azure-pipelines.yml
      - .azure-pipelines/**

pr:
  branches:
    include:
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  BUILD_CONFIGURATION: 'Release'
  BACKEND_PROJECTS: 'backend/**/*.csproj'
  FRONTEND_PATH: 'frontend'
  NODE_VERSION: '20.x'

stages:
  # STAGE 1: BUILD BACKEND
  - stage: Build_Backend
    displayName: 'Build Backend'
    jobs:
      - job: build_backend
        displayName: 'Build Backend'
        steps:
          - template: .azure-pipelines/templates/backend-build.yml
            parameters:
              projects: $(BACKEND_PROJECTS)
              buildConfiguration: $(BUILD_CONFIGURATION)

  # STAGE 2: TEST BACKEND
  - stage: Test_Backend
    displayName: 'Test Backend'
    dependsOn: Build_Backend
    condition: succeeded()
    jobs:
      - job: test_backend
        displayName: 'Test Backend'
        steps:
          - template: .azure-pipelines/templates/backend-test.yml
            parameters:
              projects: $(BACKEND_PROJECTS)
              buildConfiguration: $(BUILD_CONFIGURATION)

  # STAGE 3: DEPLOY BACKEND
    - stage: Backend_Deploy
       displayName: 'Deploy Backend'
       dependsOn: Test_Backend
       condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
       jobs:
         - deployment: deploy_backend
          displayName: 'Deploy Backend'
            environment: 'development'
             strategy:
               runOnce:
                 deploy:
                 steps:
                  - download: current
                   artifact: backend

                  - task: AzureWebApp@1
                  displayName: 'Deploy backend to Azure App Service'
                  inputs:
                    azureSubscription: 'sportson-connection'
                    appType: 'webAppLinux'
                    appName: 'sportson-backend-dev'
                    package: '$(Pipeline.Workspace)/backend/**/*.zip'

  # STAGE 4: BUILD FRONTEND
  - stage: Build_Frontend
    displayName: 'Build Frontend'
    dependsOn: Backend_Deploy
    condition: succeeded()
    jobs:
      - job: build_frontend
        displayName: 'Build Frontend'
        steps:
          - template: .azure-pipelines/templates/frontend-build.yml
            parameters:
              frontendPath: $(FRONTEND_PATH)
              nodeVersion: $(NODE_VERSION)