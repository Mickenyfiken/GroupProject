trigger:
  branches:
    include:
      - develop
      - main
  paths:
    include:
      - backend/**
      - frontend/**
      - azure-pipelines.yml
      - .azure-pipelines/**

pr:
  branches:
    include:
      - develop

pool:
  vmImage: ubuntu-latest

variables:
  - group: frontend-secrets
  - group: development-variables
  - group: production-variables

stages:
  - stage: CI
    displayName: Build & Test
    jobs:
      - job: backend
        steps:
          - template: .azure-pipelines/templates/backend-ci.yml
            parameters:
              buildConfiguration: $(BUILD_CONFIGURATION)
              nugetCache: $(Pipeline.Workspace)/.nuget/packages
              projects: $(BACKEND_PROJECTS)
              testProjects: $(BACKEND_TEST_PROJECTS)

      - job: frontend
        steps:
          - template: .azure-pipelines/templates/frontend-ci.yml
            parameters:
              frontendPath: $(FRONTEND_PATH)
              nodeVersion: $(NODE_VERSION)

  - template: .azure-pipelines/templates/deploy-stage.yml
    parameters:
      stageName: Deploy_Dev
      branch: develop
      environment: $(AZDO_ENVIRONMENT_NAME)
      backendAppName: $(BACKEND_APP_NAME)
      backendAppType: $(BACKEND_APP_TYPE)
      frontendToken: $(SWA_DEPLOYMENT_TOKEN)
      frontendAppLocation: $(FRONTEND_APP_LOCATION)

  - template: .azure-pipelines/templates/deploy-stage.yml
    parameters:
      stageName: Deploy_Prod
      branch: main
      environment: $(AZDO_ENVIRONMENT_NAME_PROD)
      backendAppName: $(BACKEND_APP_NAME_PROD)
      backendAppType: $(BACKEND_APP_TYPE)
      frontendToken: $(SWA_DEPLOYMENT_TOKEN)
      frontendAppLocation: $(FRONTEND_APP_LOCATION)
