trigger:
  branches:
    include:
      - develop
  paths:
    include:
      - backend/**
      - frontend/**
      - azure-pipelines.yml
      - .azure-pipelines/**

pr:
  branches:
    include:
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  BUILD_CONFIGURATION: 'Release'
  BACKEND_PROJECTS: 'backend/**/*.csproj'

stages:
  # STAGE 1: BUILD BACKEND
  - stage: Build_Backend
    displayName: 'Build Backend'
    jobs:
      - job: build_backend
        displayName: 'Build and Deploy Backend'
        steps:
          - template: .azure-pipelines/templates/backend-build.yml
            parameters:
              projects: $(BACKEND_PROJECTS)
              buildConfiguration: $(BUILD_CONFIGURATION)

          - task: DotNetCoreCLI@2
            displayName: 'Publish backend'
            condition: eq(variables['Build.SourceBranch'], 'refs/heads/develop')
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: $(BACKEND_PROJECTS)
              arguments: '--configuration $(BUILD_CONFIGURATION) --output $(Build.ArtifactStagingDirectory)/backend'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish backend artifact'
            condition: eq(variables['Build.SourceBranch'], 'refs/heads/develop')
            inputs:
              pathToPublish: '$(Build.ArtifactStagingDirectory)/backend'
              artifactName: 'backend'

          - task: AzureWebApp@1
            displayName: 'Deploy backend to Azure App Service'
            condition: eq(variables['Build.SourceBranch'], 'refs/heads/develop')
            inputs:
              azureSubscription: 'sportson-connection'
              appName: 'sportson-backend-dev'
              package: '$(Build.ArtifactStagingDirectory)/backend/**/*.zip'

  # STAGE 2: TEST BACKEND
  - stage: Test_Backend
    displayName: 'Test Backend'
    dependsOn: Build_Backend
    jobs:
      - job: test_backend
        steps:
          - template: .azure-pipelines/templates/backend-test.yml
            parameters:
              projects: $(BACKEND_PROJECTS)
              buildConfiguration: $(BUILD_CONFIGURATION)

  # STAGE 3: FRONTEND
  - stage: Build_Frontend
    displayName: 'Build Frontend'
    dependsOn: []
    jobs:
      - job: build_frontend
        steps:
          - template: .azure-pipelines/templates/frontend-build.yml